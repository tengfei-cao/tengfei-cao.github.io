<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>荣誉风采 - 曹腾飞教授个人主页</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
	<div class="wrap">
		<a class="nav-home" href="index.html">曹腾飞</a>
		<div class="nav-links">
			<a href="index.html">返回主页</a>
			<a href="image.html">返回相册</a>
		</div>
	</div>
</nav>

<div class="wrap">

	<div class="page-head">
		<div class="back-bar">
			<a href="index.html">← 返回主页</a>
			<a href="image.html">← 返回相册</a>
		</div>
		<h1 class="page-title">荣誉风采</h1>
		<p class="page-sub">点击图片查看大图</p>
	</div>

	<div class="gallery">
		<div class="g-item" onclick="showDetail('pic/prize/1.jpg', '荣誉1详情')">
			<img src="pic/prize/1.jpg" alt="荣誉1">
			<p class="g-cap">荣誉1</p>
		</div>
		<div class="g-item" onclick="showDetail('pic/prize/2.jpg', '荣誉2详情')">
			<img src="pic/prize/2.jpg" alt="荣誉2">
			<p class="g-cap">荣誉2</p>
		</div>
		<div class="g-item" onclick="showDetail('pic/prize/3.jpg', '荣誉3详情')">
			<img src="pic/prize/3.jpg" alt="荣誉3">
			<p class="g-cap">荣誉3</p>
		</div>
		<div class="g-item" onclick="showDetail('pic/prize/4.jpg', '荣誉4详情')">
			<img src="pic/prize/4.jpg" alt="荣誉4">
			<p class="g-cap">荣誉4</p>
		</div>
		<div class="g-item" onclick="showDetail('pic/prize/5.jpg', '荣誉5详情')">
			<img src="pic/prize/5.jpg" alt="荣誉5">
			<p class="g-cap">荣誉5</p>
		</div>
		<div class="g-item" onclick="showDetail('pic/prize/6.jpg', '荣誉6详情')">
			<img src="pic/prize/6.jpg" alt="荣誉6">
			<p class="g-cap">荣誉6</p>
		</div>
	</div>


</div>

<div class="lightbox" id="lightbox">
	<button class="lb-close" type="button" onclick="closeDetail()" aria-label="关闭">&times;</button>
	<img id="lbImg" alt="详情图">
	<p class="lightbox-cap" id="lbCap"></p>
	<div class="lb-hint">按 Esc 或点击空白处关闭</div>
</div>

<script>
	var lb = document.getElementById('lightbox');
	var lbImg = document.getElementById('lbImg');
	var lbCap = document.getElementById('lbCap');

	function showDetail(imgSrc, captionText) {
		lbImg.src = imgSrc;
		lbCap.textContent = captionText;
		lb.classList.add('open');
		document.body.style.overflow = 'hidden';
	}

	function closeDetail() {
		lb.classList.remove('open');
		lbImg.removeAttribute('src');
		document.body.style.overflow = '';
	}

	document.addEventListener('keydown', function (e) {
		if (e.key === 'Escape') closeDetail();
	});

	lb.addEventListener('click', function (e) {
		if (e.target === lb) closeDetail();
	});
</script>

</body>
</html>
