<html lang="zh-CN">
<head>

</head>
<body>

<nav class="nav">
	<div class="wrap">
		<a class="nav-home" href="index.html">曹腾飞</a>
		<div class="nav-links">
			<a href="index.html">返回主页</a>
			<a href="image.html">返回相册</a>
		</div>
	</div>
</nav>

<div class="wrap">

	<div class="page-head">
		<div class="back-bar">
			<a href="index.html">← 返回主页</a>
			<a href="image.html">← 返回相册</a>
		</div>
		<h1 class="page-title">日常生活</h1>
		<p class="page-sub">点击图片查看大图</p>
	</div>

	<div class="gallery">
		<div class="g-item" onclick="showDetail('pic/live/1.jpg', '校园')">
			<img src="pic/live/1.jpg" alt="校园">
			<p class="g-cap">校园</p>
		</div>
		<div class="g-item" onclick="showDetail('pic/live/2.jpg', '八角亭')">
			<img src="pic/live/2.jpg" alt="八角亭">
			<p class="g-cap">八角亭</p>
		</div>
		<!--
		<div class="g-item" onclick="showDetail('pic/live/3.jpg', '聚餐')">
			<img src="pic/live/3.jpg" alt="聚餐">
			<p class="g-cap">聚餐</p>
		</div>
		-->
		<div class="g-item" onclick="showDetail('pic/live/4.jpg', '杏花树')">
			<img src="pic/live/4.jpg" alt="杏花树">
			<p class="g-cap">杏花树</p>
		</div>
		<div class="g-item" onclick="showDetail('pic/live/5.jpg', '讨论')">
			<img src="pic/live/5.jpg" alt="讨论">
			<p class="g-cap">讨论</p>
		</div>
		<div class="g-item" onclick="showDetail('pic/live/6.jpg', '组会前夕')">
			<img src="pic/live/6.jpg" alt="组会前夕">
			<p class="g-cap">组会前夕</p>
		</div>
		<div class="g-item" onclick="showDetail('pic/live/7.jpg', '体育馆')">
			<img src="pic/live/7.jpg" alt="体育馆">
			<p class="g-cap">体育馆</p>
		</div>
		<div class="g-item" onclick="showDetail('pic/live/8.jpg', '敬请期待')">
			<img src="pic/live/8.jpg" alt="敬请期待">
			<p class="g-cap">敬请期待</p>
		</div>
	</div>


</div>

<div class="lightbox" id="lightbox">
	<button class="lb-close" type="button" onclick="closeDetail()" aria-label="关闭">&times;</button>
	<img id="lbImg" alt="详情图">
	<p class="lightbox-cap" id="lbCap"></p>
	<div class="lb-hint">按 Esc 或点击空白处关闭</div>
</div>

<script>
	var lb = document.getElementById('lightbox');
	var lbImg = document.getElementById('lbImg');
	var lbCap = document.getElementById('lbCap');

	function showDetail(imgSrc, captionText) {
		lbImg.src = imgSrc;
		lbCap.textContent = captionText;
		lb.classList.add('open');
		document.body.style.overflow = 'hidden';
	}

	function closeDetail() {
		lb.classList.remove('open');
		lbImg.removeAttribute('src');
		document.body.style.overflow = '';
	}

	document.addEventListener('keydown', function (e) {
		if (e.key === 'Escape') closeDetail();
	});

	lb.addEventListener('click', function (e) {
		if (e.target === lb) closeDetail();
	});
</script>

</body>
</html>
