<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活动竞赛 - 曹腾飞教授个人主页</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
	<div class="wrap">
		<a class="nav-home" href="index.html">曹腾飞</a>
		<div class="nav-links">
			<a href="index.html">返回主页</a>
			<a href="image.html">返回相册</a>
		</div>
	</div>
</nav>

<div class="wrap">

	<div class="page-head">
		<div class="back-bar">
			<a href="index.html">← 返回主页</a>
			<a href="image.html">← 返回相册</a>
		</div>
		<h1 class="page-title">活动竞赛</h1>
		<p class="page-sub">点击图片查看大图</p>
	</div>

	<div class="gallery">
		<div class="g-item" onclick="showDetail('pic/activity/2026_1.jpg', '2026年团队参加活动竞赛')">
			<img src="pic/activity/2026_1.jpg" alt="活动竞赛1">
			<p class="g-cap">2026年团队参加学术活动</p>
		</div>
		<div class="g-item" onclick="showDetail('pic/activity/2026_2.jpg', '学术活动现场')">
			<img src="pic/activity/2026_2.jpg" alt="活动竞赛2">
			<p class="g-cap">学术活动现场</p>
		</div>
		<div class="g-item" onclick="showDetail('pic/activity/2026_3.jpg', '学术活动')">
			<img src="pic/activity/2026_3.jpg" alt="活动竞赛3">
			<p class="g-cap">学术活动</p>
		</div>
		<div class="g-item" onclick="showDetail('pic/prize/5.jpg', '学生参加竞赛')">
			<img src="pic/prize/5.jpg" alt="活动1">
			<p class="g-cap">学生参加竞赛</p>
		</div>
		<div class="g-item" onclick="showDetail('pic/prize/6.jpg', '学生参加竞赛')">
			<img src="pic/prize/6.jpg" alt="荣誉2">
			<p class="g-cap">学生参加竞赛</p>
		</div>
	</div>


</div>

<div class="lightbox" id="lightbox">
	<button class="lb-close" type="button" onclick="closeDetail()" aria-label="关闭">&times;</button>
	<img id="lbImg" alt="详情图">
	<p class="lightbox-cap" id="lbCap"></p>
	<div class="lb-hint">按 Esc 或点击空白处关闭</div>
</div>

<script>
	var lb = document.getElementById('lightbox');
	var lbImg = document.getElementById('lbImg');
	var lbCap = document.getElementById('lbCap');

	function showDetail(imgSrc, captionText) {
		lbImg.src = imgSrc;
		lbCap.textContent = captionText;
		lb.classList.add('open');
		document.body.style.overflow = 'hidden';
	}

	function closeDetail() {
		lb.classList.remove('open');
		lbImg.removeAttribute('src');
		document.body.style.overflow = '';
	}

	document.addEventListener('keydown', function (e) {
		if (e.key === 'Escape') closeDetail();
	});

	lb.addEventListener('click', function (e) {
		if (e.target === lb) closeDetail();
	});
</script>

</body>
</html>
